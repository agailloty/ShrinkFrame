name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Verify dependency lock files
        run: |
          dotnet restore ShrinkFrame.sln --force-evaluate
          git diff --exit-code -- ':(glob)**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ShrinkFrame.sln --locked-mode
      - name: Build Release
        run: dotnet build ShrinkFrame.sln --configuration Release --no-restore
      - name: Test domain
        run: dotnet test tests/ShrinkFrame.Domain.Tests/ShrinkFrame.Domain.Tests.csproj --configuration Release --no-build --no-restore
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build container
        run: docker build --pull=false --tag shrinkframe:ci .
      - name: Verify image contract
        run: |
          test "$(docker image inspect shrinkframe:ci --format '{{.Config.User}}')" = "1654:1654"
          docker run --rm --entrypoint /usr/bin/ffmpeg shrinkframe:ci -hide_banner -version
          docker run --rm --entrypoint /usr/bin/ffprobe shrinkframe:ci -hide_banner -version
          docker run --rm --entrypoint /bin/bash shrinkframe:ci -c "ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264"
