name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Verify dependency lock files
        run: |
          dotnet restore ShrinkFrame.sln --force-evaluate
          git diff --exit-code -- ':(glob)**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ShrinkFrame.sln --locked-mode
      - name: Build Release
        run: dotnet build ShrinkFrame.sln --configuration Release --no-restore
      - name: Test domain
        run: dotnet test tests/ShrinkFrame.Domain.Tests/ShrinkFrame.Domain.Tests.csproj --configuration Release --no-build --no-restore
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build container
        run: docker build --pull=false --tag shrinkframe:ci .
      - name: Verify image contract
        run: |
          test "$(docker image inspect shrinkframe:ci --format '{{.Config.User}}')" = "1654:1654"
          docker run --rm --entrypoint /usr/bin/ffmpeg shrinkframe:ci -hide_banner -version
          docker run --rm --entrypoint /usr/bin/ffprobe shrinkframe:ci -hide_banner -version
          docker run --rm --entrypoint /bin/bash shrinkframe:ci -c "ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264"

  publish-container:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Define image coordinates
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="$(printf '%s' "${GITHUB_REF_NAME}" | LC_ALL=C sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//')"
          image_tag="${image_tag:0:128}"
          test -n "${image_tag}"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: |
          docker build \
            --pull=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" \
            .
      - name: Publish container
        run: docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
